<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NLP Preprocessor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .container { background: white; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 120px; padding: 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; }
        .options { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
        label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
        button { padding: 10px 28px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        button:hover { background: #45a049; }
        .result { margin-top: 24px; display: none; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .box { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
        .box h3 { margin: 0 0 10px; font-size: 14px; color: #666; }
        .box p { margin: 0; font-size: 14px; word-break: break-word; }
        .steps { margin-top: 16px; background: #e8f5e9; border-radius: 8px; padding: 12px; }
        .error { color: red; margin-top: 10px; display: none; }
        select { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌍 Multilingual Text Preprocessor</h1>

    <!-- Language -->
    <label>Language:
        <select id="language">
            <option value="en">English</option>
            <option value="ar">Arabic</option>
        </select>
    </label>

    <!-- Input -->
    <br/><br/>
    <textarea id="inputText" placeholder="Paste your text here..."></textarea>

    <!-- Options -->
    <div class="options">
        <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
        <label><input type="checkbox" id="remove_html" checked> Remove HTML</label>
        <label><input type="checkbox" id="remove_urls" checked> Remove URLs</label>
        <label><input type="checkbox" id="remove_punctuation" checked> Remove Punctuation</label>
        <label><input type="checkbox" id="remove_numbers"> Remove Numbers</label>
        <label><input type="checkbox" id="remove_stopwords" checked> Remove Stopwords</label>
        <label><input type="checkbox" id="remove_extra_whitespace" checked> Fix Whitespace</label>
        <label><input type="checkbox" id="lemmatize"> Lemmatize (EN)</label>
        <label><input type="checkbox" id="stemming"> Stemming (EN)</label>
        <label><input type="checkbox" id="remove_tashkeel" checked> Remove Tashkeel (AR)</label>
        <label><input type="checkbox" id="remove_tatweel" checked> Remove Tatweel (AR)</label>
        <label><input type="checkbox" id="normalize_alef" checked> Normalize Alef (AR)</label>
        <label><input type="checkbox" id="normalize_hamza" checked> Normalize Hamza (AR)</label>
        <label><input type="checkbox" id="normalize_teh_marbuta"> Normalize Teh Marbuta (AR)</label>
    </div>

    <button onclick="runPreprocess()">▶ Run Pipeline</button>
    <div class="error" id="errorBox"></div>

    <!-- Results -->
    <div class="result" id="results">
        <div class="result-grid">
            <div class="box">
                <h3>Original</h3>
                <p id="originalText"></p>
            </div>
            <div class="box">
                <h3>Processed</h3>
                <p id="processedText"></p>
            </div>
        </div>
        <div class="steps">
            <strong>Steps applied:</strong>
            <span id="stepsList"></span>
        </div>
    </div>
</div>

<script>
async function runPreprocess() {
    const text = document.getElementById('inputText').value.trim();
    const errorBox = document.getElementById('errorBox');
    const results = document.getElementById('results');

    errorBox.style.display = 'none';
    results.style.display = 'none';

    if (!text) {
        errorBox.textContent = 'Please enter some text!';
        errorBox.style.display = 'block';
        return;
    }

    const payload = {
        text,
        language: document.getElementById('language').value,
        lowercase: document.getElementById('lowercase').checked,
        remove_html: document.getElementById('remove_html').checked,
        remove_urls: document.getElementById('remove_urls').checked,
        remove_punctuation: document.getElementById('remove_punctuation').checked,
        remove_numbers: document.getElementById('remove_numbers').checked,
        remove_stopwords: document.getElementById('remove_stopwords').checked,
        remove_extra_whitespace: document.getElementById('remove_extra_whitespace').checked,
        lemmatize: document.getElementById('lemmatize').checked,
        stemming: document.getElementById('stemming').checked,
        remove_tashkeel: document.getElementById('remove_tashkeel').checked,
        remove_tatweel: document.getElementById('remove_tatweel').checked,
        normalize_alef: document.getElementById('normalize_alef').checked,
        normalize_hamza: document.getElementById('normalize_hamza').checked,
        normalize_teh_marbuta: document.getElementById('normalize_teh_marbuta').checked,
    };

    try {
        const res = await fetch('/api/preprocess', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (!res.ok) {
            errorBox.textContent = data.detail;
            errorBox.style.display = 'block';
            return;
        }

        document.getElementById('originalText').textContent = data.original_text;
        document.getElementById('processedText').textContent = data.processed_text;
        document.getElementById('stepsList').textContent = data.steps_applied.join(' → ');
        results.style.display = 'block';

    } catch (err) {
        errorBox.textContent = 'Something went wrong!';
        errorBox.style.display = 'block';
    }
}
</script>
</body>
</html>
